# Ключевые слова для поиска лидов. Файл подхватывается на лету -
# после сохранения перезапуск не нужен.
#
# Как считается: у каждой категории есть вес. Если в сообщении нашлось
# хотя бы одно слово категории - к баллу прибавляется её вес (один раз).
#   • балл >= min_score            → сообщение сразу уходит на проверку ИИ
#   • балл >= deep_scan_min_score  → уходит ИИ «пачкой» в фоне (глубокая проверка)
#   • балл >= sure_score           → считается лидом даже без ИИ (если ИИ выключен/недоступен)
#
# Синтаксис слов:
#   контрольная        - с учётом окончаний (контрольной, контрольную, контрольные...)
#   =решу              - точное совпадение слова, без окончаний
#   эконом*            - начинается с (экономика, экономический, эконом...)
#   нужна помощь       - фраза: слова рядом (между ними допускается одно лишнее слово)
#   're:регулярка'     - регулярное выражение по тексту в нижнем регистре (в одинарных кавычках)

min_score: 4
deep_scan_min_score: 2
sure_score: 7

