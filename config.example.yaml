# AutoLid - настройки. Файл можно править в любом текстовом редакторе.
# Мастер настройки (setup.bat / setup.sh) сам заполнит ключи и токены.
# После изменения этого файла перезапустите программу.
# (keywords.yaml и файлы в prompts/ подхватываются на лету, без перезапуска)

telegram:
  # Получить на https://my.telegram.org -> API development tools
  api_id: ""
  api_hash: ""
  # Номер телефона аккаунта, с которого читаются чаты и отправляются ответы
  phone: ""
  # Следить за ВСЕМИ группами, где состоит аккаунт (а не только из папки chats/telegram)
  monitor_all_joined: false
  # Пауза между вступлениями в чаты, секунд (случайно от min до max).
  # Телеграм банит за слишком частые вступления - не ставьте меньше 30.
  join_delay_min: 45
  join_delay_max: 90
  # Вступать также в чат комментариев, если в списке указан канал
  join_linked_discussion: true
  # Раз в N минут досматривать последние сообщения во всех чатах (страховка:
  # Telegram иногда не присылает обновления из больших групп). 0 - выключить
  history_check_minutes: 10

bot:
  # Токен вашего бота от @BotFather - сюда приходят уведомления о лидах
  token: ""
  # Кому бот присылает лиды и кто может им управлять - ники Telegram (без @).
  # Этот человек должен один раз открыть бота и нажать /start (иначе Telegram не даст боту ему написать).
  # Остальным бот отвечает «Нет доступа». Если список пуст - админом станет первый, кто нажмёт /start
  admin_usernames: []
  # То же самое по числовому ID (необязательно)
  admin_ids: []

vk:
  # Токен пользователя VK (см. README). Пусто = VK выключен
  token: ""
  # Как часто проверять стены групп, секунд
  poll_interval: 60
  # Сколько последних постов брать с каждой стены за проверку
  posts_per_check: 10
  # Проверять новые комментарии под свежими постами
  check_comments: true
  # Следить за комментариями у постов не старше стольких часов
  comments_window_hours: 24
  # Следить за ВСЕМИ беседами VK аккаунта (а не только из папки chats/vk)
  monitor_all_chats: false
  # Закрытые группы: автоматически подавать заявку на вступление
  # (открытые группы читаются и без вступления). Заявки идут с паузой, чтобы VK не выдал капчу
  auto_join_closed: true
  # Лимит запросов к VK API в секунду (у пользователя максимум 3)
  requests_per_second: 3

ai:
  enabled: true
  # Адрес и ключ провайдера ИИ. Поддерживаются два формата API:
  #   anthropic - модели Claude (claude-haiku-5-5 и т.п.), запросы на <base_url>/messages
  #   openai    - OpenAI-совместимые (/chat/completions): DeepSeek, GPT и т.п.
  #   auto      - anthropic, если модель начинается на «claude», иначе openai
  api_format: auto
  base_url: "https://api.openai.com/v1"
  api_key: ""
  model: "gpt-4o-mini"
  # Только для Claude: глубина размышлений (low - быстрее и дешевле, подходит для фильтра;
  # medium/high - вдумчивее, но медленнее). Пусто - по умолчанию модели
  effort: low
  # Только для Claude: максимум токенов в ответе ИИ
  max_tokens: 8000
  # Минимальная уверенность ИИ (0-100), чтобы считать сообщение лидом
  min_confidence: 60
  # Сколько сообщений-кандидатов проверять одним запросом
  batch_size: 6
  # Сколько ждать набора пачки, секунд (меньше = быстрее отклик)
  batch_wait: 1.5
  # Глубокая проверка: отправлять ИИ и «слабые» сообщения, где ключевых слов мало,
  # чтобы не пропускать лидов. Работает пачками, медленнее, тратит больше токенов.
  deep_scan: true
  deep_scan_batch_size: 20
  deep_scan_wait: 20
  # Не больше стольких сообщений в час на глубокую проверку (экономия токенов)
  deep_scan_max_per_hour: 600
  # Сколько параллельных запросов к ИИ
  max_concurrency: 3
  # Таймаут запроса к ИИ, секунд
  timeout: 90
  # Учиться на ваших кнопках «Не лид» / «Отправить» (примеры попадают в промпт)
  use_feedback: true

reply:
  # Режим по умолчанию (меняется в боте командой /mode):
  #   manual - бот присылает лида с готовым ответом и кнопкой «Отправить»
  #   auto   - первое сообщение лиду отправляется автоматически
  mode: manual
  # Куда писать лиду в Telegram:
  #   chat          - ответом (реплаем) на его сообщение прямо в чате
  #   chat_then_dm  - ответом в чате, а если в чат писать нельзя - в личку
  #   dm            - в личку
  #   dm_then_chat  - в личку, а если закрыта - ответом в чате
  telegram_method: chat
  # Куда писать лиду в VK:
  #   reply          - ответом на месте: комментарий под постом / ответ на комментарий /
  #                    ответ в обсуждении / ответ в беседе
  #   reply_then_dm  - ответом на месте, а если нельзя (комментарии закрыты) - в личку
  #   dm             - в личку
  #   dm_then_reply  - в личку, а если закрыта - ответом на месте
  vk_method: reply
  # Задержка автоответа, секунд: ответ уходит не мгновенно, а через это время.
  # Последние секунды аккаунт показывает «печатает...» (длительность зависит от длины текста).
  # Можно задать диапазон (например 12 и 20) - тогда задержка будет случайной в нём.
  # Пока идёт задержка, автоответ можно отменить кнопкой в боте.
  delay_min: 15
  delay_max: 15
  # Лимиты на отправку (защита аккаунтов от бана за спам)
  max_per_hour: 15
  max_per_day: 80
  # Не писать одному и тому же человеку чаще, чем раз в N часов
  author_cooldown_hours: 72
  # Не отвечать на сообщения старше N минут (например, после простоя программы)
  max_message_age_minutes: 30

filter:
  # Сообщения короче - пропускаются
  min_length: 12
  # Сообщения длиннее - почти всегда реклама, пропускаются
  max_length: 1500
  # Один и тот же текст (разосланный по многим чатам) присылать один раз за N часов
  duplicate_window_hours: 12

# Папки со ссылками на чаты (по одной ссылке на строку в .txt файлах)
paths:
  telegram_chats: chats/telegram
  vk_chats: chats/vk
  keywords: keywords.yaml
  prompts: prompts
  data: data
